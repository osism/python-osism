---
- name: Run integration tests
  hosts: all

  vars:
    python_venv_dir: /tmp/venv

  tasks:
    - name: Start Redis container
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -e
          set -o pipefail
          set -x

          docker run -d --name redis -p 6379:6379 redis:7-alpine
      changed_when: true

    - name: Wait for Redis to be ready
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -e
          set -o pipefail
          set -x

          for i in $(seq 1 30); do
            if docker exec redis redis-cli ping | grep -q PONG; then
              exit 0
            fi
            sleep 1
          done
          echo "Redis did not become ready within 30s" >&2
          exit 1
      changed_when: false

    - name: Install dependencies
      ansible.builtin.shell:
        executable: /bin/bash
        chdir: "{{ zuul.project.src_dir }}"
        cmd: |
          set -e
          set -o pipefail
          set -x

          {{ python_venv_dir }}/bin/pipenv install --dev --deploy
          {{ python_venv_dir }}/bin/pipenv run pip install .

          # Some integration tests resolve inventory variables the way the
          # deployment does, by running ansible. Install it from the same
          # requirements file the container image uses, so the version under
          # test is the version that ships and no second pin is introduced.
          {{ python_venv_dir }}/bin/pipenv run pip install -r requirements.ansible.txt

    - name: Run pytest
      ansible.builtin.shell:
        executable: /bin/bash
        chdir: "{{ zuul.project.src_dir }}"
        cmd: |
          set -e
          set -o pipefail
          set -x

          {{ python_venv_dir }}/bin/pipenv run pytest tests/integration
      environment:
        REDIS_HOST: localhost
        # The tests write and delete keys under names a real deployment also
        # uses (the vault password is stored under a fixed key), so they must
        # never run against the database a manager node keeps its state in.
        # REDIS_DB also feeds the Celery broker and result backend
        # (osism/tasks/__init__.py), so this moves every client at once.
        # tests/integration/conftest.py refuses to run against database 0.
        REDIS_DB: "15"
        # Fail the session if Redis is unreachable instead of skipping every
        # test, so a Redis-startup failure turns the job red rather than green.
        OSISM_REQUIRE_REDIS: "1"
        # Likewise for ansible: the tests that need it skip when it is absent,
        # which would let a broken install pass the job green.
        OSISM_REQUIRE_ANSIBLE: "1"
